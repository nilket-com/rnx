[package]
name = "rnx-candle"
version = "0.0.0"
edition = "2024"
publish = false
description = "A CPU tensor and small-model inference extension for rnx (record 0129)"

[workspace]

[dependencies]
rnx = { path = "../..", default-features = false, features = ["count-allocations"] }
# Record 0129: CPU only. Candle's default features are empty: no CUDA,
# Metal, MKL or Accelerate. No runtime library beyond libc: candle-core's
# tokenizers dependency builds the bundled Oniguruma C source statically,
# so the build needs a C compiler (as rnx's ring already does), not a
# system library.
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
# Record 0131: BERT for TextEncoder (default features off: no flash-attention,
# MKL or Accelerate) and the tokenizer candle-core already links (onig only,
# so esaxx-rs builds without its C++ path).
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde_json = "1"
# Record 0131: test-support only, to report the worker's rayon pool size.
rayon = { version = "1", optional = true }

[features]
# Record 0131: lowered activation caps for the batch-halving controls, and
# the inference worker's observed thread counts.
test-support = ["dep:rayon"]

[dev-dependencies]
# Record 0129: the allocator's peak, for the allocation controls only.
rnx = { path = "../..", default-features = false, features = ["count-allocations", "allocation-peak"] }

[[bin]]
name = "rnx-candle"
path = "src/main.rs"
