[package]
name = "rnx-polars"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["generated"]
# Record 0073: the generated bindings. Off gives the hand-written adapter
# alone, at its former launch cost; see plans/0073_polars_generator_evidence.md.
generated = []
test-support = ["dep:tokio"]

# Record 0068: the presentation matrix drives a wrapper-shaped binary as a
# notebook worker. Neither exists in an ordinary build.
[[bin]]
name = "rnx-polars-fixture"
path = "src/bin/fixture.rs"
required-features = ["test-support"]

[[test]]
name = "presentation"
required-features = ["test-support"]

# Record 0073: generated-only tests exist only with the generated bindings.
[[test]]
name = "generated"
required-features = ["generated", "test-support"]
[[test]]
name = "generated_oracle"
required-features = ["generated", "test-support"]
[[test]]
name = "routing"
required-features = ["generated", "test-support"]
[[test]]
name = "regcost"
required-features = ["generated", "test-support"]

[dev-dependencies]
serde_json = "1"

[dependencies]
rnx = { path = "../..", default-features = false, features = ["count-allocations"] }
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "csv", "parquet", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
# Record 0073: the generated bindings spell types by their public path
# inside the defining crate. These are the crates the facade already links
# under the features above; a direct dependency adds no feature.
polars-core = { version = "=0.55.2", default-features = false }
polars-plan = { version = "=0.55.2", default-features = false }
polars-lazy = { version = "=0.55.2", default-features = false }
polars-io = { version = "=0.55.2", default-features = false }
polars-ops = { version = "=0.55.2", default-features = false }
polars-time = { version = "=0.55.2", default-features = false }
polars-dtype = { version = "=0.55.2", default-features = false }
polars-schema = { version = "=0.55.2", default-features = false }
polars-error = { version = "=0.55.2", default-features = false }
polars-utils = { version = "=0.55.2", default-features = false }
# record 0078: `TrustedLen` by its home crate; `polars_core::utils::arrow` is not re-exported at rc2
polars-arrow = { version = "=0.55.2", default-features = false }
tokio = { version = "1", features = ["rt"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = false
[profile.release]
debug = false
