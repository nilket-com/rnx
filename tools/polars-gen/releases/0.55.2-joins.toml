# Record 0075 gate 1, second step: 0.55.2 with the join-order policy.
# Identical to 0.55.2.toml except the joins below. Justification, pinned
# sources: polars-ops-0.55.2/src/frame/join/args.rs line 124 marks
# `MaintainOrderJoin::None` as `#[default]`, and `JoinArgs::default()`
# (line 153) takes it; polars-lazy-0.55.2/src/frame/mod.rs lines 1256,
# 1281 and 1306 build inner_join, left_join and full_join with
# `JoinArgs::new`. A case is unordered only when its recorded options are
# the default arguments; an explicit `MaintainOrderJoin` keeps the case
# ordered.

name = "0.55.2"
source = "crates.io =0.55.2"
api_crates = ["polars_core", "polars_plan", "polars_lazy", "polars_io", "polars_ops", "polars_time", "polars_dtype", "polars_schema", "polars_error"]

# The inventory this policy belongs to; the generator refuses any other.
[provenance]
release = "0.55.2"
# Record 0081: the inventory must be the `adapter-narrow` documentation run
# and must have resolved exactly this Polars feature set (pins.json
# `resolved_polars_features`: the adapter's declared features and what
# they pull in), compared as a whole.
cfg = "adapter-narrow"
features = ["csv", "dtype-categorical", "dtype-i16", "dtype-i8", "dtype-u16", "dtype-u8", "lazy", "parquet", "polars-io", "polars-lazy", "polars-ops", "polars-parquet", "streaming"]

[[unordered]]
path = "polars_lazy::frame::LazyFrame::unique"
args = { subset = "*", keep_strategy = "*" }
options = "default arguments"
cite = "Polars documents unique as order-unspecified unless maintain_order is set"
[[unordered]]
path = "polars_lazy::frame::LazyFrame::unique_generic"
args = { subset = "*", keep_strategy = "*" }
options = "default arguments"
cite = "as unique"
[[unordered]]
path = "polars_plan::dsl::expr::Expr::unique"
args = { }
options = "default arguments"
cite = "as unique"
[[unordered]]
path = "polars_core::frame::dataframe::DataFrame::unique"
args = { subset = "*", keep = "*", slice = "*" }
options = "default arguments"
cite = "as unique"
[[unordered]]
path = "polars_core::series::Series::unique"
args = { }
options = "default arguments"
cite = "as unique"
[[unordered]]
path = "polars_core::frame::column::Column::unique"
args = { }
options = "default arguments"
cite = "as unique"
[[unordered]]
path = "polars_lazy::frame::LazyFrame::inner_join"
args = { other = "*", left_on = "*", right_on = "*" }
options = "default arguments"
cite = "polars-lazy-0.55.2 frame/mod.rs:1281 uses JoinArgs::new; polars-ops-0.55.2 join/args.rs:124 MaintainOrderJoin::None is #[default]"
[[unordered]]
path = "polars_lazy::frame::LazyFrame::left_join"
args = { other = "*", left_on = "*", right_on = "*" }
options = "default arguments"
cite = "polars-lazy-0.55.2 frame/mod.rs:1256 uses JoinArgs::new; args.rs:124"
[[unordered]]
path = "polars_lazy::frame::LazyFrame::full_join"
args = { other = "*", left_on = "*", right_on = "*" }
options = "default arguments"
cite = "polars-lazy-0.55.2 frame/mod.rs:1306 uses JoinArgs::new; args.rs:124"
[[unordered]]
path = "polars_lazy::frame::LazyFrame::join"
args = { other = "*", left_on = "*", right_on = "*", args = "polars::JoinArgs::default_()" }
options = "JoinArgs::default()"
cite = "polars-ops-0.55.2 join/args.rs:153 JoinArgs::default() takes maintain_order: Default::default() = None"

[[excluded_oracle]]
path = "polars_core::frame::dataframe::DataFrame::partition_by"
reason = "the order of the partitions is unspecified (Polars documents only partition_by_stable as order-maintaining); the oracle's unordered policy covers rows within one frame, not a vector of frames (record 0084, observed run to run)"
[[excluded_oracle]]
path = "polars_core::chunked_array::ChunkedArray::row_decode_ordered"
reason = "decodes arbitrary bytes as row-encoded data; the result differs run to run (record 0077, observed on BinaryOffsetChunked)"
[[excluded_oracle]]
path = "polars_core::chunked_array::ChunkedArray::row_decode_unordered"
reason = "as row_decode_ordered"
[[excluded_oracle]]
path = "polars_core::series::Series::as_single_ptr"
reason = "returns a memory address"
[[excluded_oracle]]
path = "polars_io::cloud::concurrency::ConcurrencyController::new"
reason = "Debug output shows runtime state"

# Record 0076: proven instantiations the compiler refuses. polars-arrow-0.55.2
# src/array/static_array.rs lines 52 and 80 mark `StructArray`'s
# `value_unchecked`, `iter` and `values_iter` (lines 52, 80, 83) with `no_call_const`, a compile-time panic,
# and `get`, `first`, `last`, `first_null`, `first_non_null` and `last_non_null`
# on `ChunkedArray<T>` reach them (bisected by compilation, record 0076); `iter` and `no_null_iter`
# (record 0077, iterator returns) reach `iter` and `values_iter`.
[[instantiation.exclude]]
alias = "StructChunked"
methods = ["get", "first", "last", "first_null", "first_non_null", "last_non_null", "iter", "no_null_iter", "for_each", "apply_into_string_amortized"]
cite = "polars-arrow-0.55.2 array/static_array.rs:52,80 no_call_const on StructArray"

