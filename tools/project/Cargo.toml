[package]
name = "rnx-project"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]

[dependencies]
rune = { version = "=0.14.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.9.12"
tokio = { version = "1", default-features = false, features = ["rt", "time", "process", "io-util", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = false
[profile.dev.package."*"]
opt-level = 2
