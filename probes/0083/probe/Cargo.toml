[package]
name = "probe-0083"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# The adapter's exact Polars build (record 0081 feature set); the lock is
# copied from adapters/polars so every dependency resolves identically.
[dependencies]
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "csv", "parquet", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
polars-core = { version = "=0.55.2", default-features = false }
polars-plan = { version = "=0.55.2", default-features = false }
polars-lazy = { version = "=0.55.2", default-features = false }

[profile.dev]
debug = false
