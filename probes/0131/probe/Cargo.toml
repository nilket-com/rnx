[package]
name = "probe0131"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rnx = { path = "../../..", default-features = false, features = ["count-allocations", "allocation-peak"] }
rnx-candle = { path = "../../../adapters/candle", features = ["test-support"] }
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "csv", "parquet", "json", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde_json = "1"
