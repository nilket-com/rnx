[package]
name = "ck1-column-probe"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"
[workspace]
[dependencies]
rune = { path = "../../../../crates/rune", default-features = false, features = ["execution"] }
serde_json = "1"
[build-dependencies]
cc = "1"
[profile.release]
opt-level = 3
codegen-units = 1
lto = false
panic = "unwind"
debug = true
incremental = false
